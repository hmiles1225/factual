# Hourly scan: fetch feeds, group articles into stories, publish the site and its JSON.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   FTP_HOST, FTP_USER, FTP_PASSWORD  Hostinger FTP account limited to public_html/factual/
# Until all three exist, the scan still runs and the deploy step is skipped with a notice.
#
# GitHub pauses scheduled workflows in a public repo after 60 days with no commits.
name: scan

on:
  schedule:
    - cron: "17 * * * *"   # off the top of the hour, when GitHub's scheduler is busiest
  push:
    branches: [main]   # a push is a deploy
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-${{ hashFiles('requirements.txt', 'pipeline/cluster.py') }}

      - run: pip install -r requirements.txt

      - name: Fetch
        run: python pipeline/fetch.py

      - name: Group into stories
        run: python pipeline/cluster.py

      # Checks claims in Today's top 5 stories. Daily caps are in pipeline/check_today.py
      # (Anthropic $1.00, Gemini $1.50 and 150 searches, 25 new claims). Never fails the scan.
      - name: Check Today's claims
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Tested 2026-10-19 on 20 claims: 19/20 right, no false Doesn't hold up, ~35% fewer searches.
          FACTUAL_MAX_SEARCHES: "6"
        run: python pipeline/check_today.py

      - name: Keep a copy of this run's output
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: |
            data/*.json
            data/archive/*.json
          retention-days: 3

      - name: Deploy to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::FTP secrets not set. Skipping deploy."
            exit 0
          fi
          # Hostinger's FTPS certificate is issued to *.hstgr.io, not to our domain or IP.
          # Connect to FTP_HOST but verify the certificate as hstgr.io, so TLS stays verified.
          # Upload under a temp name, then rename, so a reader never gets half a file.
          # The rename runs after curl has changed into the file's folder, so it uses the bare name.
          put() {  # put <local file> <remote path>
            name=$(basename "$2")
            # Hostinger's FTP occasionally stalls (run 81 timed out, curl exit 28): retry each file.
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
              --connect-timeout 30 --max-time 180 --retry 4 --retry-delay 5 --retry-all-errors \
              --connect-to "hstgr.io:21:$FTP_HOST:21" \
              --user "$FTP_USER:$FTP_PASSWORD" \
              -T "$1" "ftp://hstgr.io/$2.tmp" \
              -Q "-RNFR $name.tmp" -Q "-RNTO $name"
            echo "uploaded $2"
          }
          # The site first, then the data it reads.
          (cd web && find . -type f | sed 's|^\./||') | while read -r rel; do put "web/$rel" "$rel"; done
          for f in data/images/*; do if [ -f "$f" ]; then put "$f" "data/images/$(basename "$f")"; fi; done
          # stories.json goes up only when the summarizing step finished. Otherwise the site keeps the last
          # summarized list: an unsummarized one would empty Today, since Today shows summarized stories only.
          for f in data/*.json; do
            if [ "$(basename "$f")" = "stories.json" ] && [ ! -f data/.summarized ]; then
              echo "::warning::Summarizing did not finish; keeping the live stories.json"; continue
            fi
            put "$f" "data/$(basename "$f")"
          done
          for f in data/archive/*.json; do if [ -f "$f" ]; then put "$f" "data/archive/$(basename "$f")"; fi; done
          # Link-preview pages, one per story on Today (written by check_today.py), at s/<sid>.html.
          for f in data/share/*.html; do if [ -f "$f" ]; then put "$f" "s/$(basename "$f")"; fi; done
