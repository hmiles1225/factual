# Runs the claim-check eval on GitHub's servers with the repository's API keys, then commits
# the results to the eval-results branch (not main, so a run never redeploys the site).
# Start it from the Actions tab: eval > Run workflow.
name: eval

on:
  # Pushing eval/request.json starts a run with the settings in that file, so a run can be
  # started without the Actions page. Shape: {"checkers": ..., "only": ..., "reps": ..., "claude_variant": ...}
  push:
    branches: [main]
    paths: [eval/request.json]
  workflow_dispatch:
    inputs:
      checkers:
        description: "Comma-separated: gemini, claude-second (Opus re-checks Gemini's Doesn't hold up), claude (all claims), claude-capped"
        default: "gemini,claude-second"
      only:
        description: "Case ids, comma-separated (blank = all 50)"
        default: ""
      reps:
        description: "Repetitions per case"
        default: "1"
      claude_variant:
        description: "Results folder for Claude (baseline = pilot without caching, v3 = with caching)"
        default: "v3"

concurrency:
  group: eval
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FACTUAL_EVAL_FLOW: ${{ github.workspace }}/results/claim-check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: eval-results
          path: results

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Settings
        id: cfg
        env:
          IN_CHECKERS: ${{ inputs.checkers }}
          IN_ONLY: ${{ inputs.only }}
          IN_REPS: ${{ inputs.reps }}
          IN_VARIANT: ${{ inputs.claude_variant }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("eval/request.json"))
          print("checkers=" + r.get("checkers", "gemini,claude-second"))
          print("only=" + r.get("only", ""))
          print("reps=" + str(r.get("reps", 1)))
          print("claude_variant=" + r.get("claude_variant", "v3"))
          print("reverify=" + " ".join(r.get("reverify", [])))
          print("second_from=" + r.get("second_from", "v1"))
          PY
          else
            printf 'checkers=%s\nonly=%s\nreps=%s\nclaude_variant=%s\nreverify=\nsecond_from=v1\n' "$IN_CHECKERS" "$IN_ONLY" "$IN_REPS" "$IN_VARIANT" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Claude
        if: contains(format(',{0},', steps.cfg.outputs.checkers), ',claude,')
        run: python eval/run.py --checker claude --variant "${{ steps.cfg.outputs.claude_variant }}" --reps "${{ steps.cfg.outputs.reps }}" --only "${{ steps.cfg.outputs.only }}"

      - name: Gemini
        if: always() && contains(steps.cfg.outputs.checkers, 'gemini')
        run: python eval/run.py --checker gemini --variant v1 --reps "${{ steps.cfg.outputs.reps }}" --only "${{ steps.cfg.outputs.only }}"

      - name: Claude (8,000 tokens a page)
        if: always() && contains(steps.cfg.outputs.checkers, 'claude-capped')
        env:
          FACTUAL_FETCH_CAP: "8000"
        run: python eval/run.py --checker claude --variant v2 --reps "${{ steps.cfg.outputs.reps }}" --only "${{ steps.cfg.outputs.only }}"

      - name: Re-verify saved answers (no model judging; fetches pages only)
        if: always() && steps.cfg.outputs.reverify != ''
        run: python eval/reverify.py ${{ steps.cfg.outputs.reverify }}

      - name: Claude second opinion on Gemini's Doesn't hold up
        if: always() && contains(steps.cfg.outputs.checkers, 'claude-second')
        run: python eval/run.py --checker claude --variant "${{ steps.cfg.outputs.claude_variant }}" --reps "${{ steps.cfg.outputs.reps }}" --only-from "${{ steps.cfg.outputs.second_from }}" --when "Doesn't hold up"

      - name: Summarize
        if: always()
        run: python eval/summarize.py baseline v1 v2 v3 v5 >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: always()
        working-directory: results
        run: |
          git config user.name "fACTUAL eval"
          git config user.email "eval@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "eval: ${{ steps.cfg.outputs.checkers }} ${{ steps.cfg.outputs.only || 'all' }} (run ${{ github.run_id }})"
          git push -q origin HEAD:eval-results
